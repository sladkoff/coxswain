name: Release

# Actions → Release → Run workflow, with a version like 0.2.0: bumps package.json on main, tags v0.2.0, builds and
# creates the GitHub release. A version with a pre-release part (0.2.0-rc.1) makes a GitHub pre-release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0 or 0.2.0-rc.1"
        required: true

permissions:
  contents: write

jobs:
  # One job pushes the commit and tag: pushes made with the workflow's token don't start other workflows.
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version=${VERSION#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Not a version: $VERSION"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm pkg set version="$version"
          git commit -am "Release v$version"
          git tag "v$version"
          git push origin main "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    strategy:
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win --x64
          - os: ubuntu-latest
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: >
          gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --generate-notes
          $([[ "$TAG" == *-* ]] && echo --prerelease)
